<!DOCTYPE html>
<html>
<head>
    <title>Areeb Calculator</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;

            /* 🔥 Gradient Background */
            background: linear-gradient(135deg, #1e3c72, #2a5298);

            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }

        /* 🔥 Main Container */
        .container {
            background: #eef1ff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* 🔥 Calculator Name */
        .title {
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #2a2a2a;
        }

        /* 🔥 Display */
        #display {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            font-size: 22px;
            text-align: right;
            padding: 5px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: #dfe3ff;
        }

        /* 🔥 Grid Layout */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 65px); /* columns */
            gap: 10px; /* space between buttons */
        }

        button {
            height: 55px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .num {
            background: #ffffff;
        }

        .op {
            background: #2a5298;
            color: white;
        }

        .equal {
            background: #4CAF50;
            color: white;
        }

        .clear {
            background: red;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 🔥 Calculator Name -->
    <div class="title">Areeb's Calculator</div>

    <!-- Display -->
    <input type="text" id="display" disabled>

    <!-- Buttons -->
    <div class="buttons">

        <button class="num" onclick="press('7')">7</button>
        <button class="num" onclick="press('8')">8</button>
        <button class="num" onclick="press('9')">9</button>
        <button class="op" onclick="press('+')">+</button>

        <button class="num" onclick="press('4')">4</button>
        <button class="num" onclick="press('5')">5</button>
        <button class="num" onclick="press('6')">6</button>
        <button class="op" onclick="press('-')">-</button>

        <button class="num" onclick="press('1')">1</button>
        <button class="num" onclick="press('2')">2</button>
        <button class="num" onclick="press('3')">3</button>
        <button class="op" onclick="press('*')">×</button>

        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="num" onclick="press('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>
        <button class="op" onclick="press('/')">÷</button>

    </div>

</div>

<script>
    function press(val) {
        document.getElementById("display").value += val;
    }

    function clearDisplay() {
        document.getElementById("display").value = "";
    }

    function calculate() {
        try {
            let result = eval(document.getElementById("display").value);
            document.getElementById("display").value = result;
        } catch {
            alert("Invalid Input");
        }
    }
</script>

</body>
</html>
